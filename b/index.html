 <section class="section tint"><div class="container feature"><div>${img('home')}</div><div><span class="eyebrow">Per privati e strutture</span><h2>Interventi concordati, non lavori indistinti.</h2><p>Luxor predilige lavori organizzati, con un perimetro preciso e un preventivo complessivo. Non propone reperibilità 24 ore, servizi festivi o pronto intervento come offerte standard.</p><ul class="list-ticks"><li>Pulizie stagionali e a fondo delle abitazioni.</li><li>Interventi legati a traslochi o cambio di casa.</li><li>Strutture ricettive in occasione di apertura o chiusura.</li><li>Pulizie condominiali straordinarie, su richiesta.</li></ul><a class="btn" href="#/preventivo?tipo=straordinarie">Descrivi l'intervento →</a></div></div></section>

 <section class="section tint"><div class="container form-wrap"><div class="form-panel"><span class="tag">Dimostrazione interattiva</span><div class="demo-warning"><b>Questa è una demo.</b> Puoi provare il percorso, ma nessun dato viene inviato, salvato o condiviso. Non inserire informazioni personali reali.</div><div id="quote-app" aria-live="polite"></div></div><p class="preview-note">I prezzi e le condizioni dei pacchetti sono ancora da definire. Nella demo non vengono calcolati importi.</p></div></section>`
};
const navs=[['#/index','Home','home'],['#/servizi','Ambienti e servizi','servizi'],['#/chi-siamo','Chi siamo','chi'],['#/recensioni','Recensioni','recensioni'],['#/contatti','Contatti','contatti']];
const menu=navs.map(([href,txt,key])=>`<a ${page===key?'aria-current="page"':''} href="${href}">${txt}</a>`).join('');
const head=`<div class="topnote">PROPOSTA ${label} · ANTEPRIMA DIMOSTRATIVA · Nessun dato viene inviato</div><header class="site-header"><div class="container header-row"><a class="logo" href="#/index" aria-label="Pulizie Luxor, homepage">LUXOR<span>IMPRESA DI PULIZIE</span></a><button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">☰ Menu</button><nav class="nav" id="main-nav" aria-label="Menu principale">${menu}<a class="btn nav-mobile-cta" href="#/preventivo">Richiedi un preventivo →</a></nav><a class="btn header-cta" href="#/preventivo">Richiedi un preventivo →</a></div></header>`;
const foot=`<footer class="footer"><div class="container"><div class="footer-grid"><div><h3>LUXOR</h3><p>Impresa di pulizie dal 2008. Imbottiti a domicilio, ambienti professionali e pulizie straordinarie. Le immagini sono illustrazioni dimostrative.</p><span>Demo Luxor — proposta grafica indipendente</span></div><div><b>Servizi</b><div class="footer-links"><a href="#/imbottiti">Imbottiti</a><a href="#/aziende">Aziende</a><a href="#/straordinarie">Pulizie straordinarie</a><a href="#/servizi">Tutti i servizi</a></div></div><div><b>Informazioni</b><div class="footer-links"><a href="#/chi-siamo">Chi siamo</a><a href="#/recensioni">Recensioni</a><a href="#/contatti">Contatti</a><a href="#/preventivo">Richiedi un preventivo</a></div></div></div><div class="footer-bottom">PULIZIE LUXOR · Prototipo dimostrativo · Recapiti, testi legali, materiali fotografici e pacchetti da completare prima della pubblicazione.</div></div></footer>`;
document.getElementById('app').innerHTML=head+`<main id="main">${pages[page]()}</main>`+foot;
const toggle=document.getElementById('menu-toggle'),nav=document.getElementById('main-nav');toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'✕ Chiudi':'☰ Menu';});
if(page!=='preventivo')return;
const app=document.getElementById('quote-app');let step=0;
const params=new URLSearchParams((location.hash.split('?')[1]||''));
let data={tipo:['imbottiti','aziende','straordinarie'].includes(params.get('tipo'))?params.get('tipo'):'imbottiti',numero:'1',oggetto:'Divano',ambiente:'Ufficio / studio',tipoStraord:'Pulizia stagionale',comune:'',descrizione:'',abbina:false};
const typelabel={imbottiti:'Imbottiti a domicilio',aziende:'Pulizie per aziende',straordinarie:'Pulizie straordinarie'};
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function opt(list,value){return list.map(v=>`<option value="${escapeHTML(v)}" ${v===value?'selected':''}>${escapeHTML(v)}</option>`).join('');}
function render(){
let content='';
if(step===0)content=`<h2>Scegli il servizio</h2><p class="form-help">Puoi sempre tornare indietro e cambiare scelta.</p><div class="choice-row">${[['imbottiti','Divani e materassi'],['aziende','Uffici e attività'],['straordinarie','Pulizie straordinarie']].map(([k,t])=>`<label class="choice"><input type="radio" name="tipo" value="${k}" ${data.tipo===k?'checked':''}>${t}</label>`).join('')}</div>`;
if(step===1){
let specific='';
if(data.tipo==='imbottiti') specific=`<div class="field"><label for="oggetto">Elemento principale</label><select id="oggetto">${opt(['Divano','Materasso','Poltrona','Sedute imbottite','Più elementi'],data.oggetto)}</select></div><div class="field"><label for="numero">Numero di elementi (indicativo)</label><select id="numero">${opt(['1','2','3','4','5 o più'],data.numero)}</select></div><label class="choice"><input id="abbina" type="checkbox" ${data.abbina?'checked':''}>Vorrei valutare un trattamento combinato</label>`;
if(data.tipo==='aziende')specific=`<div class="field"><label for="ambiente">Tipologia ambiente</label><select id="ambiente">${opt(['Ufficio / studio','Farmacia','Negozio / attività commerciale','Altro ambiente di lavoro'],data.ambiente)}</select></div><div class="field"><label for="frequenza">Frequenza indicativa</label><select id="frequenza">${opt(['Da concordare','Settimanale','Occasionale'],data.frequenza||'Da concordare')}</select></div>`;
if(data.tipo==='straordinarie')specific=`<div class="field"><label for="tipoStraord">Tipo intervento</label><select id="tipoStraord">${opt(['Pulizia stagionale','Cambio abitazione / trasloco','Struttura ricettiva','Condominio / parti comuni','Altro intervento'],data.tipoStraord)}</select></div>`;
content=`<h2>Descrivi l'intervento</h2><p class="form-help">Campi indicativi per il prototipo, da affinare con la titolare.</p>${specific}<div class="field"><label for="comune">Comune (puoi usare un nome di esempio)</label><input id="comune" autocomplete="off" value="${escapeHTML(data.comune)}" placeholder="Es. Savignano sul Rubicone"></div><div class="field"><label for="descrizione">Note facoltative (senza dati personali)</label><textarea id="descrizione" placeholder="Dimensioni, caratteristiche, esigenze...">${escapeHTML(data.descrizione)}</textarea></div>`;
}
if(step===2){
const specific=data.tipo==='imbottiti'?`${data.numero} × ${data.oggetto}${data.abbina?' · interessato a un abbinamento':''}`:data.tipo==='aziende'?`${data.ambiente} · ${data.frequenza||'Da concordare'}`:data.tipoStraord;
content=`<h2>Riepilogo della richiesta</h2><p>Questo è ciò che Luxor riceverebbe nella versione pubblica. Qui non è previsto alcun invio.</p><div class="mock-summary"><dl><dt>Servizio</dt><dd>${typelabel[data.tipo]}</dd><dt>Dettagli</dt><dd>${escapeHTML(specific)}</dd><dt>Comune</dt><dd>${escapeHTML(data.comune||'Non specificato')}</dd><dt>Note</dt><dd>${escapeHTML(data.descrizione||'—')}</dd><dt>Prezzo</dt><dd>Da definire e confermare dalla titolare</dd></dl></div><p class="smallprint">Nel modulo reale saranno aggiunti i recapiti del cliente, informativa privacy e consenso marketing facoltativo separato.</p>`;
}
app.innerHTML=`<b class="tag">Passaggio ${step+1} di 3</b><div class="progress">${[0,1,2].map(i=>`<span class="${i<=step?'current':''}"></span>`).join('')}</div>${content}<div class="form-actions"><button class="btn ghost" type="button" id="back">${step===0?'← Tutti i servizi':'← Indietro'}</button>${step<2?'<button class="btn" type="button" id="next">Continua →</button>':'<button class="btn" type="button" id="reset">Ricomincia demo ↺</button>'}</div>`;
const back=document.getElementById('back');back.addEventListener('click',()=>{if(step===0){location.hash='#/servizi';return;} if(step===2)save();step--;render();});
if(step<2){document.getElementById('next').addEventListener('click',()=>{save();step++;render();window.scrollTo({top:0,behavior:'smooth'});});}else document.getElementById('reset').addEventListener('click',()=>{step=0;render();});
}
function save(){if(step===0){data.tipo=app.querySelector('input[name=tipo]:checked')?.value||'imbottiti';} if(step===1){['oggetto','numero','ambiente','frequenza','tipoStraord','comune','descrizione'].forEach(k=>{const e=document.getElementById(k);if(e)data[k]=e.value;});data.abbina=document.getElementById('abbina')?.checked||false;}}
render();
}
window.addEventListener('hashchange',()=>{renderSite();window.scrollTo(0,0)});
renderSite();</script></body></html>
